name: release

on:
  push:
    tags: [ 'v*' ]          # 只认 v 开头的 tag，如 v1.0.1
  workflow_dispatch:          # 也允许手动触发（用于重试发布）

permissions:
  contents: write             # 创建 GitHub Release
  id-token: write             # npm provenance（发布页显示“已验证来源”）

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 门禁：tag 版本必须与 package.json 一致，防止拿错 tag发布
      # （仅 tag 触发时校验；workflow_dispatch 手动重跑时 ref 是分支名，跳过）
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { Write-Host "FAIL tag v$tag != package.json $pkg"; exit 1 }
          Write-Host "OK  tag v$tag == package.json $pkg"

      # 发布前重跑与 checks 相同的补丁校验
      - name: 安装 PyYAML 并校验补丁
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python tools/validate_patch.py patch/free.patch.yml
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          npm pack --pack-destination dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "OK  $(Get-ChildItem dist/*.tgz).Name"

      - name: 发布到 npm
        shell: pwsh
        run: |
          # PowerShell 不展开通配符，必须先解析出真实路径再传给 npm
          # （否则 npm 把 "dist/*.tgz" 当 git spec 解析，报 Permission denied）
          $tgz = Get-ChildItem dist -Filter *.tgz | Select-Object -First 1
          if (-not $tgz) { Write-Host "FAIL 未找到 tarball"; exit 1 }
          npm publish $tgz.FullName --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 读取 tag 附言作为 Release 正文
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: pwsh
        run: |
          # 轻量 tag（git tag 无 -a）没有标签对象，%(contents) 会回退成
          # 所指 commit 的提交说明 —— 必须区分，轻量时置空走自动生成
          $type = git cat-file -t "refs/tags/$env:GITHUB_REF_NAME"
          if ($type -ne 'tag') {
            Write-Host "WARN 轻量 tag 无附言，Release 正文退回自动生成（下次请用 git tag -a -m）"
            "body<<EOF" >> $env:GITHUB_OUTPUT
            "EOF" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $subject = (git tag -l --format='%(contents:subject)' $env:GITHUB_REF_NAME) -join "`n"
          $body = (git tag -l --format='%(contents:body)' $env:GITHUB_REF_NAME) -join "`n"
          $full = ($subject + "`n`n" + $body).Trim()
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $full >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: 创建 GitHub Release（附 tarball）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: dist/*.tgz
          generate_release_notes: true
